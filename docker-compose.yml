services:
  db:
    image: postgres:14.5-alpine
    container_name: gamerave-db
    restart: always
    environment:
      POSTGRES_USER: game-review-admin
      POSTGRES_PASSWORD: game-review
      POSTGRES_DB: gamerave
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: gamerave-api
    restart: always
    ports:
      - "3333:3333"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: game-review-admin
      DB_PASSWORD: game-review
      DB_NAME: gamerave
      PORT: 3333
    depends_on:
      - db

  web:
    build: ./web
    container_name: gamerave-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333
    depends_on:
      - api

volumes:
  postgres-data:
